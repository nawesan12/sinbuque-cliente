name: SinBuque · publicar una versión

# Se dispara a mano desde la pestaña Actions, o solo al empujar una etiqueta de versión.
on:
  workflow_dispatch:
    inputs:
      plataforma:
        description: "Qué compilar"
        type: choice
        options:
          - ambas
          - android
          - windows
        default: ambas
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      upload-artifact: true
      upload-tag: ${{ github.ref_name }}
      # Al empujar una etiqueta no hay inputs, y ahí queremos las dos plataformas.
      plataforma: ${{ inputs.plataforma || 'ambas' }}
