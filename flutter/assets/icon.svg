<!-- SinBuque. Misma marca que el ícono de la aplicación (ver res/gen_sinbuque_icon.py):
     dos pantallas, una atrás en contorno y otra adelante llena, separadas por un hueco. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="sinbuque" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c5ce6"/>
      <stop offset="1" stop-color="#4c7dff"/>
    </linearGradient>
    <mask id="sinbuque-corte">
      <rect width="100" height="100" fill="black"/>
      <rect x="20" y="22" width="43" height="35" rx="5.5"
            fill="none" stroke="white" stroke-width="5.2"/>
      <rect x="32.7" y="36.7" width="51.6" height="45.1" rx="8.3" fill="black"/>
    </mask>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#sinbuque)"/>
  <rect width="100" height="100" fill="white" mask="url(#sinbuque-corte)"/>
  <rect x="35.5" y="39.5" width="46" height="39.5" rx="5.5" fill="white"/>
</svg>
